<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b0bec5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#90a4ae;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#78909c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1565c0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196f3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1976d2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#42a5f5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Globe circle -->
  <circle cx="45" cy="50" r="30" fill="url(#globeGrad)" stroke="#607d8b" stroke-width="1.5"/>
  <!-- Globe horizontal lines -->
  <ellipse cx="45" cy="38" rx="28" ry="4" fill="none" stroke="#546e7a" stroke-width="1.2" opacity="0.6"/>
  <ellipse cx="45" cy="50" rx="30" ry="4" fill="none" stroke="#546e7a" stroke-width="1.2" opacity="0.6"/>
  <ellipse cx="45" cy="62" rx="28" ry="4" fill="none" stroke="#546e7a" stroke-width="1.2" opacity="0.6"/>
  <!-- Globe vertical line -->
  <ellipse cx="45" cy="50" rx="12" ry="30" fill="none" stroke="#546e7a" stroke-width="1.2" opacity="0.6"/>
  <ellipse cx="45" cy="50" rx="22" ry="30" fill="none" stroke="#546e7a" stroke-width="1" opacity="0.4"/>
  <!-- Arrow swoosh 1 - wrapping around globe from bottom-left to top-right -->
  <path d="M 15 68 C 20 55, 40 30, 75 25" fill="none" stroke="url(#arrowGrad)" stroke-width="5" stroke-linecap="round"/>
  <!-- Arrowhead -->
  <polygon points="75,18 82,28 72,30" fill="url(#arrowGrad)" />
  <!-- Arrow swoosh 2 - smaller accent -->
  <path d="M 20 75 C 30 65, 50 42, 70 35" fill="none" stroke="url(#arrowGrad2)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
</svg>